[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "artping-bot"
version = "0.1.0"
description = "Discord community bot tailored to the Fjormcord community"
requires-python = ">=3.10"
dependencies = [
    "discord.py==2.7.1",
    # Comes with discord.py; used directly to read the Voting Gauntlet page
    "aiohttp>=3.7.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
artping-bot = "fjormcord.bot.artping.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fjormcord*"]
namespaces = true
