[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "artping-bot"
version = "0.1.0"
description = "Discord community bot tailored to the Fjormcord community"
requires-python = ">=3.10"
dependencies = [
    "discord.py==2.7.1",
    # Comes with discord.py; used directly to read the Voting Gauntlet page
    "aiohttp>=3.7.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[project.scripts]
artping-bot = "fjormcord.bot.artping.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (unused imports and variables, undefined names), import order, double quotes and the line length; the
# formatter handles the rest
select = ["F", "I", "Q", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["fjormcord", "tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fjormcord*"]
namespaces = true
