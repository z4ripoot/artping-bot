# Defaults, committed. Don't put a token here: create config.ini next to this file with
#   [discord]
#   token=<your bot token>
# config.ini is not committed and overrides any setting from this file.
[discord]
token=

[database]
path=test.db

[art_ping]
# Seconds a user has to wait after a ~artping before using it again (admins don't wait); 0 disables the cooldown
cooldown_seconds=1

[tasks]
# ID of the channel for the Coliseum reminders; empty disables them
coliseum_notification_channel_id=

