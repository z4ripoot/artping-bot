# An example of config.ini, committed; the bot reads only config.ini. Copy this file to config.ini next to it and fill
# in your bot's token. config.ini is not committed, so never put a token here. Every setting must be in config.ini.
[discord]
token=
# For development: syncs the slash commands to this server only, instantly; empty in production
guild_id=

[database]
path=test.db

[commands]
# Seconds a user has to wait after any command before using another one (admins don't wait); 0 disables
# the cooldown
cooldown_seconds=1
# How many names the autocomplete of a slash command option offers at most, 1-25
autocomplete_max_choices=20

[art_ping]
# How many characters /artping takes, 1-25; applied on restart
slash_max_characters=10

[character_vote]
# Number of users who have to click the Vote button of a non-admin's addcharacter vote before the character is added;
# a click of an admin passes the vote right away. Below 2 there are no votes: non-admins add characters directly too
votes_needed=5
# Emoji on the Vote button: a Unicode emoji, or a custom one as <:name:id>. It must be a valid Unicode emoji or a
# custom emoji of a server the bot is in, or Discord rejects the vote messages and votes can't be started
emoji=⭐

[tasks]
# ID of the channel for the Coliseum reminders; empty disables them
coliseum_notification_channel_id=
# ID of the channel for the Divine Games reminders; empty disables them
divine_games_notification_channel_id=
# ID of the channel for the hourly Voting Gauntlet scores, posted while a round runs; empty disables them
voting_gauntlet_channel_id=

