# Defaults, committed. Don't put a token here: create config.ini next to this file with
#   [discord]
#   token=<your bot token>
# config.ini is not committed and overrides any setting from this file.
[discord]
token=
# For development: syncs the slash commands to this server only, instantly; empty in production
guild_id=

[database]
path=test.db

[art_ping]
# Seconds a user has to wait after a ~artping before using it again (admins don't wait); 0 disables the cooldown
cooldown_seconds=1
# How many characters /artping takes, 1-25; applied on restart
slash_max_characters=10

[character_vote]
# Number of users who have to click the Vote button of a non-admin's addcharacter vote before the character is added;
# a click of an admin passes the vote right away. Below 2 there are no votes: non-admins add characters directly too
votes_needed=5
# Emoji on the Vote button: a Unicode emoji, or a custom one as <:name:id>. It must be a valid Unicode emoji or a
# custom emoji of a server the bot is in, or Discord rejects the vote messages and votes can't be started
emoji=⭐

[tasks]
# ID of the channel for the Coliseum reminders; empty disables them
coliseum_notification_channel_id=

